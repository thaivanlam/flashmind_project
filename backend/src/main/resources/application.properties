spring.application.name=flashmind
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashmind}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9yRmxhc2hNaW5kQXBwbGljYXRpb24yMDI2}
app.jwt.access-expiration=3600000
app.jwt.refresh-expiration=604800000

# Claude (Anthropic)
anthropic.api-key=${ANTHROPIC_API_KEY:your-api-key-here}
anthropic.model=claude-opus-5
anthropic.max-tokens=16000
anthropic.timeout-seconds=120

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.flashmind=DEBUG
